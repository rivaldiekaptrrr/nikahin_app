name: Multiplatform Build & Release (Nikahin)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]

permissions:
  contents: write

# =============================================================================
# 🔘 SAKELAR PLATFORM CI/CD (Ubah 'true' / 'false' di bawah untuk aktifkan/nonaktifkan)
# =============================================================================
env:
  BUILD_ANDROID: 'true'   # [Aktif] Build APK Release Android di Linux runner
  BUILD_IOS: 'false'      # [Standby] Ubah ke 'true' untuk jalankan validasi iOS di macOS runner
  BUILD_WEB: 'false'      # [Standby] Ubah ke 'true' untuk build rilis Web (HTML/JS/CanvasKit)
  BUILD_WINDOWS: 'false'  # [Standby] Ubah ke 'true' untuk build rilis Windows Desktop (.exe/zip)

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1: Build Android Release APK & Publish GitHub Release (Push Tag v*)
  # ---------------------------------------------------------------------------
  build-android:
    name: Build Android APK
    if: env.BUILD_ANDROID == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'

      - name: Get Dependencies
        run: flutter pub get

      - name: Analyze Flutter Code
        run: flutter analyze

      - name: Run Unit & Widget Tests
        run: flutter test
        continue-on-error: true

      - name: Build Release APK
        run: flutter build apk --release

      # Skenario 1: Push ke branch main / master (Build Internal Developer)
      - name: Rename APK for Main/Master Branch
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/app-nikahin-main.apk

      - name: Upload Main Artifact
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: app-nikahin-main
          path: build/app/outputs/flutter-apk/app-nikahin-main.apk
          if-no-files-found: error
          retention-days: 14

      # Skenario 2: Push Tag v* (Rilis Resmi ke Pengguna)
      - name: Set Release Environment from Tag
        if: startsWith(github.ref, 'refs/tags/v')
        id: release_env
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_OUTPUT
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/app-nikahin-${TAG_NAME}.apk"

      - name: Upload Release Artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: app-nikahin-${{ steps.release_env.outputs.TAG_NAME }}
          path: build/app/outputs/flutter-apk/app-nikahin-${{ steps.release_env.outputs.TAG_NAME }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Prepare Release Notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ ! -f RELEASE_NOTES.md ]; then
            echo "Pembaruan rilis resmi Nikahin ${{ steps.release_env.outputs.TAG_NAME }}." > RELEASE_NOTES.md
          fi

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Nikahin ${{ steps.release_env.outputs.TAG_NAME }}"
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: build/app/outputs/flutter-apk/app-nikahin-${{ steps.release_env.outputs.TAG_NAME }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # JOB 2: Validate iOS Build (macOS Runner) — Diaktifkan via BUILD_IOS: 'true'
  # ---------------------------------------------------------------------------
  validate-ios:
    name: Validate iOS Build
    if: env.BUILD_IOS == 'true'
    runs-on: macos-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Validate iOS Compilation
        run: flutter build ios --no-codesign

  # ---------------------------------------------------------------------------
  # JOB 3: Build Web Bundle — Diaktifkan via BUILD_WEB: 'true'
  # ---------------------------------------------------------------------------
  build-web:
    name: Build Web Application
    if: env.BUILD_WEB == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Web Production Bundle
        run: flutter build web --release

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nikahin-web-bundle
          path: build/web
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # JOB 4: Build Windows Desktop — Diaktifkan via BUILD_WINDOWS: 'true'
  # ---------------------------------------------------------------------------
  build-windows:
    name: Build Windows Desktop App
    if: env.BUILD_WINDOWS == 'true'
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop Support
        run: flutter config --enable-windows-desktop

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Windows Executable
        run: flutter build windows --release

      - name: Compress Windows Build Folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build\outputs
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath build\outputs\app-nikahin-windows-x64.zip -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-nikahin-windows-x64
          path: build\outputs\app-nikahin-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
