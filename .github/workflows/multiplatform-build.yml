name: Multiplatform Build & Release (Nikahin)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # 🔘 SAKELAR PLATFORM KENDALI (Ubah 'true' / 'false' di bawah)
  # ---------------------------------------------------------------------------
  platform-flags:
    name: Platform Configuration
    runs-on: ubuntu-latest
    outputs:
      build_android: ${{ steps.toggle.outputs.build_android }}
      build_ios: ${{ steps.toggle.outputs.build_ios }}
      build_web: ${{ steps.toggle.outputs.build_web }}
      build_windows: ${{ steps.toggle.outputs.build_windows }}
    steps:
      - id: toggle
        run: |
          # Ubah nilai flag di bawah ini:
          echo "build_android=true" >> $GITHUB_OUTPUT
          echo "build_ios=false" >> $GITHUB_OUTPUT
          echo "build_web=false" >> $GITHUB_OUTPUT
          echo "build_windows=false" >> $GITHUB_OUTPUT

  # ---------------------------------------------------------------------------
  # JOB 1: Build Android Release APK & Publish GitHub Release (Push Tag v*)
  # ---------------------------------------------------------------------------
  build-android:
    name: Build Android APK
    needs: platform-flags
    if: needs.platform-flags.outputs.build_android == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'

      - name: Get Dependencies
        run: flutter pub get

      - name: Analyze Flutter Code
        run: flutter analyze

      - name: Run Unit & Widget Tests
        run: flutter test
        continue-on-error: true

      - name: Setup Keystore & Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > upload-keystore.jks
            cp upload-keystore.jks android/upload-keystore.jks
            cat <<EOF > android/key.properties
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=../upload-keystore.jks
          EOF
            echo "Release Keystore and key.properties configured successfully."
          else
            echo "No Keystore Secret found. Building with debug fallback."
          fi

      - name: Build Release APK
        env:
          MIDTRANS_PROD_KEY: ${{ secrets.MIDTRANS_PRODUCTION_SERVER_KEY }}
          MIDTRANS_SANDBOX_KEY: ${{ secrets.MIDTRANS_SANDBOX_SERVER_KEY }}
        run: |
          DART_DEFINES=""
          if [ -n "$MIDTRANS_PROD_KEY" ]; then
            DART_DEFINES="$DART_DEFINES --dart-define=MIDTRANS_PRODUCTION_SERVER_KEY=$MIDTRANS_PROD_KEY"
          fi
          if [ -n "$MIDTRANS_SANDBOX_KEY" ]; then
            DART_DEFINES="$DART_DEFINES --dart-define=MIDTRANS_SANDBOX_SERVER_KEY=$MIDTRANS_SANDBOX_KEY"
          fi
          flutter build apk --release $DART_DEFINES

      # Skenario 1: Push ke branch main / master (Build Internal Developer)
      - name: Rename APK for Main/Master Branch
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/app-nikahin-main.apk

      - name: Upload Main Artifact
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: app-nikahin-main
          path: build/app/outputs/flutter-apk/app-nikahin-main.apk
          if-no-files-found: error
          retention-days: 14

      # Skenario 2: Push Tag v* (Rilis Resmi ke Pengguna)
      - name: Set Release Environment from Tag
        if: startsWith(github.ref, 'refs/tags/v')
        id: release_env
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_OUTPUT
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/app-nikahin-${TAG_NAME}.apk"

      - name: Upload Release Artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: app-nikahin-${{ steps.release_env.outputs.TAG_NAME }}
          path: build/app/outputs/flutter-apk/app-nikahin-${{ steps.release_env.outputs.TAG_NAME }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Prepare Release Notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ ! -f RELEASE_NOTES.md ]; then
            echo "Pembaruan rilis resmi Nikahin ${{ steps.release_env.outputs.TAG_NAME }}." > RELEASE_NOTES.md
          fi

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Nikahin ${{ steps.release_env.outputs.TAG_NAME }}"
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: build/app/outputs/flutter-apk/app-nikahin-${{ steps.release_env.outputs.TAG_NAME }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # JOB 2: Validate iOS Build (macOS Runner)
  # ---------------------------------------------------------------------------
  validate-ios:
    name: Validate iOS Build
    needs: platform-flags
    if: needs.platform-flags.outputs.build_ios == 'true'
    runs-on: macos-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Validate iOS Compilation
        run: flutter build ios --no-codesign

  # ---------------------------------------------------------------------------
  # JOB 3: Build Web Bundle
  # ---------------------------------------------------------------------------
  build-web:
    name: Build Web Application
    needs: platform-flags
    if: needs.platform-flags.outputs.build_web == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Web Production Bundle
        run: flutter build web --release

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nikahin-web-bundle
          path: build/web
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # JOB 4: Build Windows Desktop
  # ---------------------------------------------------------------------------
  build-windows:
    name: Build Windows Desktop App
    needs: platform-flags
    if: needs.platform-flags.outputs.build_windows == 'true'
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop Support
        run: flutter config --enable-windows-desktop

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Windows Executable
        run: flutter build windows --release

      - name: Compress Windows Build Folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build\outputs
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath build\outputs\app-nikahin-windows-x64.zip -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-nikahin-windows-x64
          path: build\outputs\app-nikahin-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
