<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <!-- Sacred Jasmine White / Ivory Cream Gradient -->
    <linearGradient id="jasminePetalGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#FFFBF5" />
      <stop offset="75%" stop-color="#FDF0DE" />
      <stop offset="100%" stop-color="#EEDAC0" />
    </linearGradient>
    <radialGradient id="jasmineCenter" cx="30%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#C5DEB3" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#E4EDD8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <!-- Soft Realistic Drop Shadow -->
    <filter id="jasmineShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="2" dy="6" stdDeviation="5" flood-color="#3D3226" flood-opacity="0.14" />
    </filter>
  </defs>

  <g filter="url(#jasmineShadow)">
    <!-- Slender Elegant Jasmine Petal Shape -->
    <path
      d="M28 88 C 22 72, 24 44, 46 18 C 54 8, 62 8, 68 16 C 82 34, 82 66, 68 84 C 58 96, 38 96, 28 88 Z"
      fill="url(#jasminePetalGrad)"
    />
    <!-- Tender Green Calyx Touch at the Base -->
    <path
      d="M28 88 C 26 80, 32 72, 42 74 C 48 76, 44 86, 38 90 C 34 92, 30 90, 28 88 Z"
      fill="url(#jasmineCenter)"
    />
    <!-- Delicate Translucent Petal Rib -->
    <path
      d="M36 86 C 44 68, 52 44, 58 14"
      stroke="#EEDAC0"
      stroke-width="1"
      stroke-linecap="round"
      opacity="0.45"
    />
  </g>
</svg>

