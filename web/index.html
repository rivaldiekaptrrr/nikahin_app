<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Nikahin - Aplikasi Perencana Pernikahan, Anggaran, Tamu, dan Rundown Acara">
  <meta name="theme-color" content="#D4AF37">

  <!-- Google Sign-In Web Client ID -->
  <meta name="google-signin-client_id" content="341345982329-l6fcmgpoi17qh8okbk3c6vmftq4qsgb4.apps.googleusercontent.com">

  <!-- iOS PWA Meta Tags & Icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Nikahin">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Nikahin - Wedding Planner & Budget Management</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #FFFDF9;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    #app-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #FFFDF9;
      z-index: 999999;
      transition: opacity 0.35s ease, visibility 0.35s ease;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    #app-splash.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-logo {
      width: 78px;
      height: 78px;
      border-radius: 20px;
      box-shadow: 0 12px 28px rgba(74, 19, 40, 0.12);
      margin-bottom: 20px;
      animation: gentle-pulse 2.4s ease-in-out infinite;
    }

    .splash-title {
      font-size: 22px;
      font-weight: 700;
      color: #4A1328;
      letter-spacing: -0.3px;
      margin-bottom: 6px;
    }

    .splash-subtitle {
      font-size: 13px;
      color: #8C7B70;
      margin-bottom: 28px;
      letter-spacing: 0.1px;
    }

    .splash-spinner {
      width: 26px;
      height: 26px;
      border: 2.5px solid rgba(212, 175, 55, 0.22);
      border-top-color: #D4AF37;
      border-radius: 50%;
      animation: spin 0.8s cubic-bezier(0.4, 0.1, 0.2, 1) infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes gentle-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }
  </style>
</head>
<body>
  <!-- Elegant Branded First-Load Splash Screen -->
  <div id="app-splash">
    <img src="icons/apple-touch-icon.png" alt="Nikahin" class="splash-logo" />
    <div class="splash-title">Nikahin</div>
    <div class="splash-subtitle">Menyiapkan hari bahagia Anda...</div>
    <div class="splash-spinner"></div>
  </div>

  <script>
    // Smoothly remove splash once Flutter view renders in the DOM
    (function() {
      var splash = document.getElementById('app-splash');
      if (!splash) return;

      function hideSplash() {
        if (!splash || splash.classList.contains('hidden')) return;
        splash.classList.add('hidden');
        setTimeout(function() {
          if (splash && splash.parentNode) {
            splash.parentNode.removeChild(splash);
          }
        }, 400);
      }

      var observer = new MutationObserver(function(mutations, obs) {
        var flutterElement = document.querySelector('flutter-view, flt-glass-pane');
        if (flutterElement) {
          hideSplash();
          obs.disconnect();
        }
      });

      observer.observe(document.body, { childList: true, subtree: true });

      // Fallback timer to guarantee dismissal even under abnormal network delays
      setTimeout(hideSplash, 6000);
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
