<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <title>Nikahin Onboarding - Impian Pernikahan</title>
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="55%" stop-color="#FDF3E7" />
      <stop offset="100%" stop-color="#F5E3D0" />
    </radialGradient>

    <linearGradient id="plateBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECD499" />
      <stop offset="40%" stop-color="#AA771C" />
      <stop offset="70%" stop-color="#F7E7B4" />
      <stop offset="100%" stop-color="#B8860B" />
    </linearGradient>

    <!-- Master Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="22%" stop-color="#FFF3A8" />
      <stop offset="42%" stop-color="#AA771C" />
      <stop offset="68%" stop-color="#FDF0A6" />
      <stop offset="85%" stop-color="#C59B27" />
      <stop offset="100%" stop-color="#8B6508" />
    </linearGradient>

    <!-- Master Pink Gradient for Heart Curve -->
    <linearGradient id="pinkLineGrad" x1="80" y1="300" x2="345" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B80D57" />
      <stop offset="45%" stop-color="#DE1A66" />
      <stop offset="78%" stop-color="#EE3B80" />
      <stop offset="100%" stop-color="#B80D57" />
    </linearGradient>

    <!-- Bar Graph Gradient -->
    <linearGradient id="barGrad" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#FF9EBB" />
      <stop offset="22%" stop-color="#E31C64" />
      <stop offset="45%" stop-color="#B30047" />
      <stop offset="58%" stop-color="#FF7DA7" />
      <stop offset="75%" stop-color="#D4145A" />
      <stop offset="100%" stop-color="#9E0039" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#8B572A" flood-opacity="0.18" />
    </filter>

    <!-- Clips for Ring and Line -->
    <clipPath id="innerCircleClip">
      <circle cx="195" cy="215" r="113" />
    </clipPath>

    <clipPath id="lineAndHeartClip">
      <circle cx="195" cy="215" r="113" />
      <rect x="195" y="0" width="205" height="225" />
    </clipPath>

    <mask id="ringBehindLoveMask">
      <rect x="0" y="0" width="400" height="400" fill="#FFFFFF" />
      <polygon points="248,105 259,120 278,128 262,145" fill="#000000" />
      <path d="M 262,145 C 275,126 298,116 320,104 C 346,90 354,60 332,46 C 314,35 295,48 289,66 C 285,46 268,31 249,38 C 226,46 230,80 250,108 L 259,120 Z" fill="#000000" />
    </mask>
  </defs>

  <!-- Circular Outer Halo & Decorative Orbit -->
  <circle cx="256" cy="256" r="244" fill="none" stroke="#E8D5BE" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.8" />
  
  <!-- Main Plate -->
  <circle cx="256" cy="256" r="230" fill="url(#bgGrad)" stroke="url(#plateBorderGrad)" stroke-width="3.5" filter="url(#dropShadow)" />

  <!-- Inner Soft Golden Ring -->
  <circle cx="256" cy="256" r="208" fill="none" stroke="#F0DCBA" stroke-width="1" opacity="0.6" />

  <!-- Background Ambient Glow behind Logo -->
  <circle cx="256" cy="250" r="130" fill="#FEEFD8" opacity="0.7" filter="url(#softGlow)" />

  <!-- Sparkles & Celebration Accents -->
  <!-- Top Left Sparkle -->
  <g transform="translate(100, 115) scale(0.95)">
    <path d="M 0,-18 Q 0,0 18,0 Q 0,0 0,18 Q 0,0 -18,0 Q 0,0 0,-18 Z" fill="url(#goldGrad)" />
    <circle cx="0" cy="0" r="2" fill="#FFFFFF" />
  </g>
  <!-- Top Right Sparkle -->
  <g transform="translate(410, 130) scale(1.1)">
    <path d="M 0,-20 Q 0,0 20,0 Q 0,0 0,20 Q 0,0 -20,0 Q 0,0 0,-20 Z" fill="url(#goldGrad)" />
    <circle cx="0" cy="0" r="3" fill="#FFFFFF" />
  </g>
  <!-- Bottom Left Mini Sparkle -->
  <g transform="translate(90, 360) scale(0.7)">
    <path d="M 0,-14 Q 0,0 14,0 Q 0,0 0,14 Q 0,0 -14,0 Q 0,0 0,-14 Z" fill="url(#goldGrad)" opacity="0.85" />
  </g>
  <!-- Bottom Right Sparkle -->
  <g transform="translate(405, 370) scale(0.85)">
    <path d="M 0,-16 Q 0,0 16,0 Q 0,0 0,16 Q 0,0 -16,0 Q 0,0 0,-16 Z" fill="url(#goldGrad)" opacity="0.9" />
  </g>

  <!-- Small floating golden orbs -->
  <circle cx="120" cy="220" r="4" fill="url(#goldGrad)" opacity="0.75" />
  <circle cx="390" cy="245" r="5" fill="url(#goldGrad)" opacity="0.7" />
  <circle cx="256" cy="85" r="3.5" fill="url(#goldGrad)" opacity="0.8" />
  <circle cx="360" cy="95" r="2.5" fill="url(#goldGrad)" opacity="0.7" />

  <!-- Master Nikahin Symbol (Scaled & Centered) -->
  <g transform="translate(256, 262) scale(0.96) translate(-212, -200)" filter="url(#dropShadow)">
    <!-- 1. Diagram Batang -->
    <g clip-path="url(#innerCircleClip)">
      <polygon points="122,350 122,276 145,250 164,265 164,350" fill="url(#barGrad)" />
      <polygon points="180,350 180,238 202,210 222,228 222,350" fill="url(#barGrad)" />
      <polygon points="238,350 238,215 280,156 280,350" fill="url(#barGrad)" />
    </g>

    <!-- 2. Cincin Emas -->
    <g mask="url(#ringBehindLoveMask)">
      <circle cx="195" cy="215" r="124" fill="none" stroke="url(#goldGrad)" stroke-width="24" />
    </g>

    <!-- 3. Garis Cinta & Puncak Love -->
    <g clip-path="url(#lineAndHeartClip)">
      <path d="M 85,295 
               L 138,225 
               L 158,240 
               L 198,184 
               L 222,202 
               L 262,145 
               C 275,126 298,116 320,104 
               C 346,90 354,60 332,46 
               C 314,35 295,48 289,66 
               C 285,46 268,31 249,38 
               C 226,46 230,80 250,108 
               L 259,120" fill="none" stroke="url(#pinkLineGrad)" stroke-width="21" stroke-linecap="butt" stroke-linejoin="round" />
    </g>
  </g>
</svg>
