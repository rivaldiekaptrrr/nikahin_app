<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <title>Nikahin - Horizontal Lockup (Light Background)</title>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&amp;family=Plus+Jakarta+Sans:wght@600&amp;display=swap');
      .brand-title {
        font-family: 'Playfair Display', Georgia, 'Times New Roman', serif;
        font-size: 108px;
        font-weight: 700;
        letter-spacing: -0.02em;
        fill: #4A1328;
      }
      .brand-tagline {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        font-size: 26px;
        font-weight: 600;
        letter-spacing: 0.26em;
        fill: #C47A1E;
      }
    </style>
    <linearGradient id="gGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0BE5A"/>
      <stop offset="1" stop-color="#C47A1E"/>
    </linearGradient>
  </defs>

  <!-- Left Symbol (Scaled to 320px Box) -->
  <g transform="translate(40, 40) scale(0.3125)">
    <g transform="translate(0, -24)">
      <!-- 5 Kelopak Bunga Melati (Deep Rose) -->
      <g fill="#9A1F47">
        <path d="M512 520C440 470 400 380 408 300C470 330 520 420 512 520Z" transform="rotate(-24 512 520)" opacity=".78"/>
        <path d="M512 520C584 470 624 380 616 300C554 330 504 420 512 520Z" transform="rotate(24 512 520)" opacity=".78"/>
        <path d="M512 520C440 470 400 380 408 300C470 330 520 420 512 520Z" transform="rotate(-52 512 520)" opacity=".50"/>
        <path d="M512 520C584 470 624 380 616 300C554 330 504 420 512 520Z" transform="rotate(52 512 520)" opacity=".50"/>
        <path d="M512 250C566 330 578 430 512 530C446 430 458 330 512 250Z"/>
      </g>
      <!-- Busur Emas -->
      <path d="M 363 606 A 27 27 0 0 0 309 606 A 203 203 0 0 0 715 606 A 27 27 0 0 0 661 606 A 149 149 0 0 1 363 606 Z" fill="url(#gGold)"/>
      <!-- Cincin Kecil -->
      <path d="M 512 560 A 38 38 0 1 0 512 636 A 38 38 0 1 0 512 560 Z M 512 576 A 22 22 0 1 1 512 620 A 22 22 0 1 1 512 576 Z" fill="#9A1F47" fill-rule="evenodd"/>
    </g>
  </g>

  <!-- Right Typography (Wordmark + Tagline) -->
  <text x="390" y="205" class="brand-title">Nikahin</text>
  <text x="394" y="260" class="brand-tagline">WEDDING PLANNER</text>
</svg>
