<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Nikahin - Master App Icon (iOS &amp; General)</title>
  <defs>
    <linearGradient id="gPlum" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3D0F21"/>
      <stop offset="50%" stop-color="#2D0B18"/>
      <stop offset="100%" stop-color="#19060E"/>
    </linearGradient>
    <linearGradient id="gGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5CE7A"/>
      <stop offset="100%" stop-color="#C47A1E"/>
    </linearGradient>
  </defs>

  <!-- Background Plate (Full Bleed for iOS App Store) -->
  <rect width="1024" height="1024" fill="url(#gPlum)"/>

  <!-- Centered Symbol (Scale 0.68 with Optical Shift) -->
  <g transform="translate(164, 164) scale(0.68)">
    <g transform="translate(0, -24)">
      <!-- 5 Kelopak Bunga Melati (Cream Gading) -->
      <g fill="#FFF3DF">
        <path d="M512 520C440 470 400 380 408 300C470 330 520 420 512 520Z" transform="rotate(-24 512 520)" opacity=".78"/>
        <path d="M512 520C584 470 624 380 616 300C554 330 504 420 512 520Z" transform="rotate(24 512 520)" opacity=".78"/>
        <path d="M512 520C440 470 400 380 408 300C470 330 520 420 512 520Z" transform="rotate(-52 512 520)" opacity=".50"/>
        <path d="M512 520C584 470 624 380 616 300C554 330 504 420 512 520Z" transform="rotate(52 512 520)" opacity=".50"/>
        <path d="M512 250C566 330 578 430 512 530C446 430 458 330 512 250Z"/>
      </g>
      <!-- Busur Emas (Crescent) -->
      <path d="M 363 606 A 27 27 0 0 0 309 606 A 203 203 0 0 0 715 606 A 27 27 0 0 0 661 606 A 149 149 0 0 1 363 606 Z" fill="url(#gGold)"/>
      <!-- Cincin Kecil (Ring) -->
      <path d="M 512 560 A 38 38 0 1 0 512 636 A 38 38 0 1 0 512 560 Z M 512 576 A 22 22 0 1 1 512 620 A 22 22 0 1 1 512 576 Z" fill="#FFF3DF" fill-rule="evenodd"/>
    </g>
  </g>
</svg>
