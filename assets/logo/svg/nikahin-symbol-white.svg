<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <title>Nikahin - Master Symbol (Monochrome White)</title>
  <defs>
    <clipPath id="innerCircleClipWhite">
      <circle cx="195" cy="215" r="113" />
    </clipPath>
    <clipPath id="lineAndHeartClipWhite">
      <circle cx="195" cy="215" r="113" />
      <rect x="195" y="0" width="205" height="225" />
    </clipPath>
    <mask id="ringBehindLoveMaskWhite">
      <rect x="0" y="0" width="400" height="400" fill="#FFFFFF" />
      <polygon points="248,105 259,120 278,128 262,145" fill="#000000" />
      <path d="M 262,145 C 275,126 298,116 320,104 C 346,90 354,60 332,46 C 314,35 295,48 289,66 C 285,46 268,31 249,38 C 226,46 230,80 250,108 L 259,120 Z" fill="#000000" />
    </mask>
  </defs>

  <!-- 1. Diagram Batang (White) -->
  <g clip-path="url(#innerCircleClipWhite)">
    <polygon points="122,350 122,276 145,250 164,265 164,350" fill="#FFFFFF" />
    <polygon points="180,350 180,238 202,210 222,228 222,350" fill="#FFFFFF" />
    <polygon points="238,350 238,215 280,156 280,350" fill="#FFFFFF" />
  </g>

  <!-- 2. Cincin (White) -->
  <g mask="url(#ringBehindLoveMaskWhite)">
    <circle cx="195" cy="215" r="124" fill="none" stroke="#FFFFFF" stroke-width="24" />
  </g>

  <!-- 3. Garis Zig-Zag & Love (White with Dark Boundary) -->
  <g clip-path="url(#lineAndHeartClipWhite)">
    <path d="M 85,295 L 138,225 L 158,240 L 198,184 L 222,202 L 262,145 C 275,126 298,116 320,104 C 346,90 354,60 332,46 C 314,35 295,48 289,66 C 285,46 268,31 249,38 C 226,46 230,80 250,108 L 259,120"
      fill="none" stroke="#220912" stroke-width="29" stroke-linecap="butt" stroke-linejoin="round" />
    <path d="M 85,295 L 138,225 L 158,240 L 198,184 L 222,202 L 262,145 C 275,126 298,116 320,104 C 346,90 354,60 332,46 C 314,35 295,48 289,66 C 285,46 268,31 249,38 C 226,46 230,80 250,108 L 259,120"
      fill="none" stroke="#FFFFFF" stroke-width="21" stroke-linecap="butt" stroke-linejoin="round" />
  </g>
</svg>
