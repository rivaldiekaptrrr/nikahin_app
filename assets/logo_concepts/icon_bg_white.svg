<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Nikahin - Master App Icon (iOS &amp; General)</title>
  <defs>
    <!-- Gradasi Background Midnight Wine -->
    <linearGradient id="gPlumIcon" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#FFFFFF"/>
  <stop offset="100%" stop-color="#F8FAFC"/>
</linearGradient>

    <!-- Gradasi Emas untuk Lingkaran Luar -->
    <linearGradient id="goldGradApp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="22%" stop-color="#FFF3A8" />
      <stop offset="42%" stop-color="#AA771C" />
      <stop offset="68%" stop-color="#FDF0A6" />
      <stop offset="85%" stop-color="#C59B27" />
      <stop offset="100%" stop-color="#8B6508" />
    </linearGradient>

    <!-- Gradasi Merah Muda / Magenta untuk Garis dan Hati -->
    <linearGradient id="pinkLineGradApp" x1="80" y1="300" x2="345" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B80D57" />
      <stop offset="45%" stop-color="#DE1A66" />
      <stop offset="78%" stop-color="#EE3B80" />
      <stop offset="100%" stop-color="#B80D57" />
    </linearGradient>

    <!-- Gradasi Diagram Batang dengan Efek Kilau Diagonal -->
    <linearGradient id="barGradApp" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#FF9EBB" />
      <stop offset="22%" stop-color="#E31C64" />
      <stop offset="45%" stop-color="#B30047" />
      <stop offset="58%" stop-color="#FF7DA7" />
      <stop offset="75%" stop-color="#D4145A" />
      <stop offset="100%" stop-color="#9E0039" />
    </linearGradient>

    <clipPath id="innerCircleClipApp">
      <circle cx="195" cy="215" r="113" />
    </clipPath>

    <clipPath id="lineAndHeartClipApp">
      <circle cx="195" cy="215" r="113" />
      <rect x="195" y="0" width="205" height="225" />
    </clipPath>

    <mask id="ringBehindLoveMaskApp">
      <rect x="0" y="0" width="400" height="400" fill="#FFFFFF" />
      <polygon points="248,105 259,120 278,128 262,145" fill="#000000" />
      <path d="M 262,145 C 275,126 298,116 320,104 C 346,90 354,60 332,46 C 314,35 295,48 289,66 C 285,46 268,31 249,38 C 226,46 230,80 250,108 L 259,120 Z" fill="#000000" />
    </mask>
  </defs>

  <!-- Solid Background Plate for iOS Store -->
  <rect width="1024" height="1024" fill="url(#gPlumIcon)"/>

  <!-- Centered & Enlarged Symbol (Scale 2.6x, filling 80% of canvas) -->
  <g transform="translate(-13, 9) scale(2.6)">
    <g clip-path="url(#innerCircleClipApp)">
      <polygon points="122,350 122,276 145,250 164,265 164,350" fill="url(#barGradApp)" />
      <polygon points="180,350 180,238 202,210 222,228 222,350" fill="url(#barGradApp)" />
      <polygon points="238,350 238,215 280,156 280,350" fill="url(#barGradApp)" />
    </g>

    <g mask="url(#ringBehindLoveMaskApp)">
      <circle cx="195" cy="215" r="124" fill="none" stroke="url(#goldGradApp)" stroke-width="24" />
    </g>

    <g clip-path="url(#lineAndHeartClipApp)">
      <path d="M 85,295 L 138,225 L 158,240 L 198,184 L 222,202 L 262,145 C 275,126 298,116 320,104 C 346,90 354,60 332,46 C 314,35 295,48 289,66 C 285,46 268,31 249,38 C 226,46 230,80 250,108 L 259,120"
        fill="none" stroke="url(#pinkLineGradApp)" stroke-width="21" stroke-linecap="butt" stroke-linejoin="round" />
    </g>
  </g>
</svg>
